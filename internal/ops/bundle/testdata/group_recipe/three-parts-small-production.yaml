# The Small Production tier. Production: every runtime replicated, every managed
# service highly available, dedicated CPU.
#
# zcp wrote this file from the Mate "mono-mate". It is the group's now: a person
# may edit it. zcp adds only a whole tier the group repo lacks; into a tier it
# already carries, zcp proposes only a service's scale (group-recipe
# scaling=<hostname>), a managed service added to the Mate's project or a part's
# service added or removed (group-recipe service=<hostname>), as a change a
# person reviews.
#
# Priority is the order services are created in, each wave deployed before the
# next starts: the managed services first, then every runtime before the
# runtimes whose build reads it.

project:
  name: mono production
  vault:
    API_URL: http://api:8080
    WEB_URL: https://web-${zeropsSubdomainHost}-3000.prg1.zerops.app

services:
  - hostname: db
    type: postgresql:ha@17
    priority: 10
    profile: oltp-staging

  - hostname: web
    type: nodejs@22
    priority: 1
    zeropsSetup: web
    buildFromGit: https://hq.example.com/git/app-1/appdev
    enableSubdomainAccess: true
    minContainers: 2
    maxContainers: 2
    verticalAutoscaling:
      cpuMode: DEDICATED
      minCpu: 1
      maxCpu: 2
      minRam: 1
      maxRam: 4

  - hostname: api
    type: nodejs@22
    priority: 1
    zeropsSetup: api
    buildFromGit: https://hq.example.com/git/app-1/appdev
    enableSubdomainAccess: true
    minContainers: 2
    maxContainers: 2
    verticalAutoscaling:
      cpuMode: DEDICATED
      minCpu: 1
      maxCpu: 2
      minRam: 1
      maxRam: 4
    vault:
      API_PORT: "8080"

  - hostname: worker
    type: nodejs@22
    priority: 1
    zeropsSetup: worker
    buildFromGit: https://hq.example.com/git/app-1/appdev
    enableSubdomainAccess: true
    minContainers: 2
    maxContainers: 2
    verticalAutoscaling:
      cpuMode: DEDICATED
      minCpu: 1
      maxCpu: 2
      minRam: 1
      maxRam: 4
