# The Stage tier. One shared environment per group, fed by a branch — the
# shape a person shows a client.
#
# zcp wrote this file from the Mate "Zerops Apps - Jago". It is the group's now:
# a person may edit it. zcp adds only a whole tier the group repo lacks; into a
# tier it already carries, zcp proposes only a service's scale (group-recipe
# scaling=<hostname>) or a managed service added to the Mate's project
# (group-recipe service=<hostname>), as a change a person reviews.
#
# Priority is the order services are created in, each wave deployed before the
# next starts: the managed services first, then every runtime before the
# runtimes whose build reads it.
#
# The line below is zcp's mark: the Mate's project this file was composed from
# and a digest of the file. While the file stays exactly as zcp wrote it, zcp
# proposes it anew, as a change a person reviews, when that Mate's project
# changes shape — a part added or removed, a dev pool, a runtime's type; an
# edit of any line makes the file the group's alone.
# zcp-recipe: p-jago sha256=4c3d50d7ee695809251229427eaed76eadb99cf8a541795d1063d9be25bedd91

project:
  name: zerops-apps stage
  corePackage: LIGHT

services:
  - hostname: box
    type: alpine/static@1.0
    priority: 1
    zeropsSetup: box
    buildFromGit: https://hq.example.com/git/org-1/app-1/apps
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 2
      minRam: 0.25
      maxRam: 1

  - hostname: hq
    type: alpine/static@1.0
    priority: 1
    zeropsSetup: hq
    buildFromGit: https://hq.example.com/git/org-1/app-1/apps
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 2
      minRam: 0.25
      maxRam: 1

  - hostname: web
    type: alpine/nodejs@24
    priority: 1
    zeropsSetup: web
    buildFromGit: https://hq.example.com/git/org-1/app-1/apps
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 4
      minRam: 0.5
      maxRam: 4
