# The AI Agent tier. The project a Zerops Mate works in: every runtime as a
# dev/stage pair, with the managed services they share.
#
# zcp wrote this file from the Mate "mono-mate". It is the group's now: a person
# may edit it. zcp adds only a whole tier the group repo lacks; into a tier it
# already carries, zcp proposes only a service's scale (group-recipe
# scaling=<hostname>), a managed service added to the Mate's project or a part's
# service added or removed (group-recipe service=<hostname>), as a change a
# person reviews.
#
# Priority is the order services are created in, each wave deployed before the
# next starts: the managed services first, then every runtime before the
# runtimes whose build reads it.

project:
  name: mono-mate
  vault:
    API_URL: http://apistage:8080
    WEB_URL: https://webstage-${zeropsSubdomainHost}-3000.prg1.zerops.app

services:
  - hostname: db
    type: postgresql@17
    priority: 10
    profile: oltp-hobby

  - hostname: appdev
    type: nodejs@22
    priority: 1
    zeropsSetup: dev
    buildFromGit: https://hq.example.com/git/app-1/appdev
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 2
      minRam: 1
      maxRam: 4

  - hostname: webstage
    type: nodejs@22
    priority: 1
    zeropsSetup: web
    buildFromGit: https://hq.example.com/git/app-1/appdev
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 2
      minRam: 1
      maxRam: 4

  - hostname: apistage
    type: nodejs@22
    priority: 1
    zeropsSetup: api
    buildFromGit: https://hq.example.com/git/app-1/appdev
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 2
      minRam: 1
      maxRam: 4
    vault:
      API_PORT: "8080"

  - hostname: workerstage
    type: nodejs@22
    priority: 1
    zeropsSetup: worker
    buildFromGit: https://hq.example.com/git/app-1/appdev
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 2
      minRam: 1
      maxRam: 4
