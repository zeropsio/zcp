#zeropsPreprocessor=on
# The Stage tier. One shared environment per group, fed by a branch — the
# shape a person shows a client.
#
# zcp wrote this file from the Mate "medusa-juno". It is the group's now: a
# person may edit it. zcp adds only a whole tier the group repo lacks; into a
# tier it already carries, zcp proposes only a service's scale (group-recipe
# scaling=<hostname>), as a change a person reviews.
#
# Priority is the order services are created in, each wave deployed before the
# next starts: the managed services first, then every runtime before the
# runtimes whose build reads it.

project:
  name: medusa stage
  corePackage: LIGHT
  envVariables:
    API_URL: https://medusa-${zeropsSubdomainHost}-9000.prg1.zerops.app
    APP_URL: https://nextstore-${zeropsSubdomainHost}-8000.prg1.zerops.app
    MEDUSA_INTERNAL_URL: http://medusa:9000
    STOREFRONT_INTERNAL_URL: http://nextstore:8000
    STORE_PUBLISHABLE_KEY: ${medusa_CHANNEL_PUBLISHABLE_KEY}
    STRIPE_PUBLISHABLE_KEY: ""
    SUPERADMIN_EMAIL: admin@example.com
  envSecrets:
    COOKIE_SECRET: <@generateRandomString(<40>)>
    JWT_SECRET: <@generateRandomString(<48>)>
    RELOAD_SECRET: <@generateRandomString(<20>)>
    # Set by hand in medusa-juno; set it again here.
    SENDGRID_API_KEY: <@generateRandomString(<64>)>
    STRIPE_API_KEY: ""
    STRIPE_WEBHOOK_SECRET: ""
    SUPERADMIN_PASSWORD: <@generateRandomString(<16>)>

services:
  - hostname: db
    type: postgresql@17
    priority: 10
    profile: oltp-hobby
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 3
      minRam: 0.25
      maxRam: 4
      minDisk: 1
      maxDisk: 20

  - hostname: redis
    type: valkey@7.2
    priority: 10
    profile: hobby
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 2
      minRam: 0.25
      maxRam: 2
      minDisk: 1
      maxDisk: 5

  - hostname: search
    type: meilisearch@1.20
    priority: 10
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 3
      minRam: 2
      maxRam: 4
      minDisk: 1
      maxDisk: 20
      minFreeRamGB: 0.5

  - hostname: storage
    type: object-storage
    priority: 10
    objectStorageSize: 5
    objectStoragePolicy: public-read

  - hostname: medusa
    type: nodejs@22
    priority: 2
    zeropsSetup: medusaprod
    buildFromGit: https://hq.example.com/git/app-1/medusadev
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 5
      minRam: 1
      maxRam: 8
      minDisk: 1
      maxDisk: 20
    envSecrets:
      ADMIN_CORS: https://medusa-${zeropsSubdomainHost}-9000.prg1.zerops.app
      # Set by hand in medusa-juno; set it again here.
      MEDUSA_ADMIN_TOKEN: <@generateRandomString(<28>)>
      MEDUSA_WORKER_MODE: server

  - hostname: nextstore
    type: nodejs@22
    priority: 1
    zeropsSetup: nextstoreprod
    buildFromGit: https://hq.example.com/git/app-1/nextstoredev
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 5
      minRam: 1
      maxRam: 4
      minDisk: 1
      maxDisk: 10
    envSecrets:
      # Set by hand in medusa-juno; set it again here.
      OPENAI_API_KEY: <@generateRandomString(<32>)>

  - hostname: mailpit
    type: alpine@3.21
    priority: 1
    buildFromGit: https://github.com/zerops-recipe-apps/mailpit-app
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 2
      minRam: 0.25
      maxRam: 1
    envSecrets:
      # Set by hand in medusa-juno; set it again here.
      MP_UI_AUTH: admin:<@generateRandomString(<16>)>
