# The AI Agent tier. The project a Zerops Mate works in: every part as its dev
# pool or dev service and its stage, with the services they share.
#
# zcp wrote this file from the Mate "Zerops Apps - Jago". It is the group's now:
# a person may edit it. zcp adds only a whole tier the group repo lacks; into a
# tier it already carries, zcp proposes only a service's scale (group-recipe
# scaling=<hostname>) or a managed service added to the Mate's project
# (group-recipe service=<hostname>), as a change a person reviews.
#
# Priority is the order services are created in, each wave deployed before the
# next starts: the managed services first, then every runtime before the
# runtimes whose build reads it.
#
# The line below is zcp's mark: the Mate's project this file was composed from
# and a digest of the file. While the file stays exactly as zcp wrote it, zcp
# proposes it anew, as a change a person reviews, when that Mate's project
# changes shape — a part added or removed, a dev pool, a runtime's type; an
# edit of any line makes the file the group's alone.
# zcp-recipe: p-jago sha256=0e8d6a20f230caa0c8bfe14aa8dbe8ea9286fe7f77157919467a736c2232beeb

project:
  name: Zerops Apps - Jago
  corePackage: LIGHT

services:
  # A dev pool: one container leased per branch of the repository its stage
  # builds from. Its image is that repository's setup "boxpool", deployed from a
  # lease once the Mate runs; this import builds nothing.
  - hostname: boxpool
    type: swarm@1
    priority: 1
    minContainers: 0
    maxContainers: 3
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 8
      minRam: 4
      maxRam: 16
      minDisk: 1
      maxDisk: 100
    vault:
      NODE_ENV: development
      sshIsolation: vpn service@zcp

  - hostname: boxstage
    type: alpine/static@1.0
    priority: 1
    zeropsSetup: box
    buildFromGit: https://hq.example.com/git/org-1/app-1/apps
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 2
      minRam: 0.25
      maxRam: 1

  # A dev pool: one container leased per branch of the repository its stage
  # builds from. Its image is that repository's setup "hqpool", deployed from a
  # lease once the Mate runs; this import builds nothing.
  - hostname: hqpool
    type: swarm@1
    priority: 1
    minContainers: 0
    maxContainers: 3
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 8
      minRam: 4
      maxRam: 16
      minDisk: 1
      maxDisk: 100
    vault:
      NODE_ENV: development
      sshIsolation: vpn service@zcp

  - hostname: hqstage
    type: alpine/static@1.0
    priority: 1
    zeropsSetup: hq
    buildFromGit: https://hq.example.com/git/org-1/app-1/apps
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 2
      minRam: 0.25
      maxRam: 1

  # A dev pool: one container leased per branch of the repository its stage
  # builds from. Its image is that repository's setup "webpool", deployed from a
  # lease once the Mate runs; this import builds nothing.
  - hostname: webpool
    type: swarm@1
    priority: 1
    minContainers: 0
    maxContainers: 3
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 8
      minRam: 4
      maxRam: 16
      minDisk: 1
      maxDisk: 100
    vault:
      NODE_ENV: development
      sshIsolation: vpn service@zcp

  - hostname: webstage
    type: alpine/nodejs@24
    priority: 1
    zeropsSetup: web
    buildFromGit: https://hq.example.com/git/org-1/app-1/apps
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 4
      minRam: 0.5
      maxRam: 4
