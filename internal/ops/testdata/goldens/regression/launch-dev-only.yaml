project:
    corePackage: SERIOUS
    envVariables:
        PORT: "3000"
    location: eu-central
    name: api-prod
    tags:
        - env:prod
        - source-project:source-dev-only
        - managed-by:zcp-launch
services:
    - buildFromGit: https://github.com/example/api
      hostname: api
      minContainers: 2
      mode: NON_HA
      type: nodejs@22
      verticalAutoscaling:
        cpuMode: DEDICATED
      zeropsSetup: prod
    - hostname: db
      mode: HA
      priority: 10
      type: postgresql@16
