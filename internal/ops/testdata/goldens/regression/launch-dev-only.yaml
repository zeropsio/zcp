project:
    corePackage: SERIOUS
    envVariables:
        PORT: "3000"
    location: eu-central
    name: api-prod
    tags:
        - env:prod
        - source-project:source-dev-only
        - managed-by:zcp-launch
services:
    - hostname: api
      minContainers: 2
      startWithoutCode: true
      type: nodejs@22
      verticalAutoscaling:
        cpuMode: DEDICATED
    - hostname: db
      priority: 10
      profile: oltp-staging
      type: postgresql:ha@16
