project:
    corePackage: SERIOUS
    envVariables:
        APP_DEBUG: "false"
        APP_ENV: production
    location: eu-central
    name: laravel-prod
    tags:
        - env:prod
        - source-project:source-recipe-laravel
        - managed-by:zcp-launch
services:
    - hostname: app
      minContainers: 2
      startWithoutCode: true
      type: php-nginx@8.3+8.0
      verticalAutoscaling:
        cpuMode: DEDICATED
    - hostname: db
      priority: 10
      profile: oltp-staging
      type: postgresql:ha@16
    - hostname: redis
      priority: 10
      profile: staging
      type: valkey:ha@7.2
    - hostname: storage
      objectStorageSize: 1
      priority: 10
      type: object-storage
