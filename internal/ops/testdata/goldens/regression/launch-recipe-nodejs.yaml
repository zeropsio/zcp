project:
    corePackage: SERIOUS
    location: eu-central
    name: node-recipe-prod
    tags:
        - env:prod
        - source-project:source-recipe-nodejs
        - managed-by:zcp-launch
    vault:
        LOG_LEVEL: info
        NODE_ENV: production
services:
    - hostname: app
      minContainers: 2
      startWithoutCode: true
      type: nodejs@22
      verticalAutoscaling:
        cpuMode: DEDICATED
    - hostname: db
      priority: 10
      profile: oltp-staging
      type: postgresql:ha@16
    - hostname: redis
      priority: 10
      profile: staging
      type: valkey:ha@7.2
