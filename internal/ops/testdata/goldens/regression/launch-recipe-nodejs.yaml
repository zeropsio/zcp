project:
    corePackage: SERIOUS
    envVariables:
        LOG_LEVEL: info
        NODE_ENV: production
    location: eu-central
    name: node-recipe-prod
    tags:
        - env:prod
        - source-project:source-recipe-nodejs
        - managed-by:zcp-launch
services:
    - hostname: app
      minContainers: 2
      mode: NON_HA
      startWithoutCode: true
      type: nodejs@22
      verticalAutoscaling:
        cpuMode: DEDICATED
    - hostname: db
      mode: HA
      priority: 10
      type: postgresql@16
    - hostname: redis
      mode: HA
      priority: 10
      type: valkey@7
