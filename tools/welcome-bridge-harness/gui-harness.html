<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zerops GUI harness — welcome auth-bridge</title>
<!--
  Local stand-in for the embedding Zerops GUI's auth-bridge receiver.

  This page mirrors the FRONTEND RECEIVER CONTRACT (frontend-legacy
  code-server-overlay: validate the broadcast trigger, then ack). The
  authoritative home of that contract is docs/spec-welcome-mode.md §4
  (W-AUTH) and the two extension templates it pins
  (internal/content/templates/vscode-bootstrap-welcome.{js,html}). If EITHER
  end of the loop changes — the payload shape, the channel/version, the ack
  format, or the origin rules — update BOTH the frontend receiver and this
  file. This is a test double, never a security boundary.

  It is self-contained (no external assets, no network requests of its own):
  a full-height iframe of the real code-server (the `cs` query param) plus a
  fixed side panel that logs every bridge event and banners on accept. The
  code-server webview broadcasts its trigger to window.top (this page); we
  validate it exactly as the receiver does, and — in ack mode — reply to the
  webview so the host's phase line advances.
-->
<style>
  :root {
    --bg: #0f1117; --panel: #161a24; --bd: #2a2f3d; --fg: #d7dbe4;
    --mut: #8b93a7; --teal: #3dd6c2; --red: #f87171; --amber: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    grid-template-columns: 1fr minmax(320px, 380px);
    height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #cs-frame { width: 100%; height: 100%; border: 0; background: #1e1e1e; }
  .side {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-left: 1px solid var(--bd);
    background: var(--panel);
  }
  .side-head { padding: 12px 14px; border-bottom: 1px solid var(--bd); }
  .side-head h1 { margin: 0 0 4px; font-size: 13px; font-weight: 650; color: #fff; }
  .side-head .meta { margin: 0; font-size: 11px; color: var(--mut); word-break: break-all; }
  .side-head .meta b { color: var(--teal); font-weight: 600; }
  .banner {
    margin: 10px 14px 0;
    padding: 10px 12px;
    border: 1px solid var(--teal);
    border-radius: 8px;
    background: rgba(61,214,194,.12);
    color: var(--teal);
    font-weight: 650;
    font-size: 12.5px;
  }
  .banner[hidden] { display: none; }
  .log {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 10px 14px 20px;
    font: 11px/1.5 "SFMono-Regular", Consolas, monospace;
  }
  .entry { padding: 6px 0; border-bottom: 1px solid rgba(120,130,150,.12); }
  .entry .verdict { font-weight: 700; }
  .entry .v-accept { color: var(--teal); }
  .entry .v-reject { color: var(--amber); }
  .entry .v-ignored { color: var(--red); }
  .entry .sub { color: var(--mut); word-break: break-all; }
</style></head>
<body>
  <iframe id="cs-frame" title="code-server under test"
          allow="clipboard-read; clipboard-write"></iframe>

  <aside class="side">
    <div class="side-head">
      <h1>Zerops GUI harness</h1>
      <p class="meta">receiver for <b id="cs-origin">—</b></p>
      <p class="meta">mode <b id="mode-label">—</b> · agents <b id="agents-label">—</b></p>
      <p class="meta">ackDelay <b id="ackdelay-label">—</b>ms · clockSkew <b id="skew-label">—</b>ms</p>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="log" id="log"></div>
  </aside>

<script>
// ---- config from query params -------------------------------------------
const params = new URLSearchParams(location.search);
const CS_URL = params.get("cs") || "";
// ack/silent (docs/spec-welcome-mode.md §4.2, the auth trigger/ack flow) vs
// launch (§4.3, the NEW embed command channel): launch drives set-mode ->
// launch-agent off the FIRST embed-ready announce instead of waiting for an
// Authorize click — see driveLaunchOnAnnounce below.
const MODE = params.get("mode") === "silent" ? "silent" : params.get("mode") === "launch" ? "launch" : "ack";
const AGENTS = (params.get("agents") || "claude-code,codex,antigravity,grok,cursor")
  .split(",").map((s) => s.trim().toLowerCase()).filter(Boolean);
// AGENT (singular): which agent MODE=launch's happy path launches — reuses
// the same query param the runner already threads through for ack/silent's
// AGENT env var (see run.mjs).
const AGENT = (params.get("agent") || "claude-code").trim().toLowerCase();

// The bridge channel + version — literal copies of welcome.js's own
// constants (spec-welcome-mode.md §4). A test double carries its own copy;
// there is no require() boundary from a browser page into the extension.
const BRIDGE_CHANNEL = "@zerops/zcp-agent-auth-bridge";
const BRIDGE_VERSION = 1;

// crypto.randomUUID() emits a v4 UUID — the receiver validates the eventId
// against the v4 shape (case-insensitive) exactly as the real frontend does.
const UUID_V4 = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

// createdAt freshness window (spec §4: UUIDv4 + TTL). Accept a message whose
// createdAt is at most 30s old and no more than 5s in the future. The ±5s
// future-skew tolerance MIRRORS the deployed frontend receiver's own
// contract (defense in depth for residual browser-clock drift) — since
// welcome.html now re-stamps createdAt on the BROWSER clock immediately
// before sending (docs/spec-welcome-mode.md §4), the container↔browser skew
// class this constant used to be the primary guard against is gone; its
// name and value stay pinned to the real contract regardless, so this
// double never drifts from it unnoticed.
const MAX_AGE_MS = 30000;
const MAX_SKEW_MS = 5000; // mirrors the deployed FE's own clock-skew tolerance

// clockSkewMs (query param, default 0): subtracted from this page's own
// Date.now() everywhere "now" matters (freshness check + the ageMs log
// field below) — simulates a receiver whose clock runs BEHIND the
// container's, proving the ±5s tolerance actually covers that case.
const CLOCK_SKEW_MS = Number(params.get("clockSkewMs")) || 0;
function receiverNow() { return Date.now() - CLOCK_SKEW_MS; }

// ackDelayMs (query param, default 0): how long to wait before sending the
// ACCEPTED ack — simulates the deployed FE's real contract (it acks
// accepted:true only AFTER its dialog actually dispatches, itself bounded
// by its own ≤10s container-readiness check), so a runner can prove the
// host's ACK_TIMEOUT_MS window (12s, spec §4) has enough headroom. Never
// delays the accepted:false/"unsupported-agent" rejection ack — that one is
// a structural decision the real receiver makes immediately, with nothing
// to wait on.
const ACK_DELAY_MS = Number(params.get("ackDelayMs")) || 0;

let CS_ORIGIN = "";
try { CS_ORIGIN = new URL(CS_URL).origin; } catch (_) { CS_ORIGIN = ""; }

// Structured log the puppeteer runner reads directly off window.__bridgeLog.
// Shape per entry: {ts, verdict, agentType, eventId, origin, ageMs, payloadKeys}.
window.__bridgeLog = [];

const seenEventIds = new Set(); // replay guard — an eventId is honored once

document.getElementById("cs-origin").textContent = CS_ORIGIN || "(invalid cs)";
document.getElementById("mode-label").textContent = MODE;
document.getElementById("agents-label").textContent = AGENTS.join(", ") || "(none)";
document.getElementById("ackdelay-label").textContent = String(ACK_DELAY_MS);
document.getElementById("skew-label").textContent = String(CLOCK_SKEW_MS);

// Point the iframe at the real code-server. The runner authenticates INSIDE
// this frame (the code-server auth cookie is Partitioned, so it is scoped to
// this localhost top-level, not a first-party visit).
const frame = document.getElementById("cs-frame");
if (CS_URL) frame.src = CS_URL;

// ---- rendering ----------------------------------------------------------
function verdictClass(verdict) {
  if (verdict === "accept" || verdict === "announce" || verdict === "agent-ready") return "v-accept";
  if (verdict === "reject:unsupported" || verdict === "launch-failed") return "v-reject";
  return "v-ignored";
}

function render(entry) {
  const el = document.createElement("div");
  el.className = "entry";
  const head = document.createElement("div");
  const v = document.createElement("span");
  v.className = "verdict " + verdictClass(entry.verdict);
  v.textContent = entry.verdict;
  head.appendChild(v);
  if (entry.agentType || entry.agentId) {
    const a = document.createElement("span");
    a.textContent = "  " + (entry.agentType || entry.agentId);
    head.appendChild(a);
  }
  const sub = document.createElement("div");
  sub.className = "sub";
  sub.textContent = "origin=" + entry.origin + " · keys=[" + entry.payloadKeys.join(",") + "]" +
    (entry.eventId ? " · eid=" + entry.eventId.slice(0, 8) + "…" : "") +
    (entry.reason ? " · reason=" + entry.reason : "");
  el.appendChild(head);
  el.appendChild(sub);
  const logEl = document.getElementById("log");
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
}

function record(verdict, ev, data) {
  const now = receiverNow();
  const entry = {
    ts: now,
    verdict,
    // agentType (§4.2 open-agent-auth trigger) vs agentId (§4.3 launch-agent/
    // agent-ready/launch-failed) are genuinely different fields on the wire —
    // kept as separate entry keys rather than collapsed into one, so an
    // existing ack/silent consumer keying on entry.agentType is unaffected.
    agentType: (data && typeof data.agentType === "string") ? data.agentType : "",
    agentId: (data && typeof data.agentId === "string") ? data.agentId : "",
    eventId: (data && typeof data.eventId === "string") ? data.eventId : "",
    reason: (data && typeof data.reason === "string") ? data.reason : "",
    origin: ev ? ev.origin : "",
    // ageMs = how old the trigger's createdAt was when THIS receiver (on its
    // own, possibly clockSkewMs-shifted, clock) saw it — lets a runner prove
    // the ackDelayMs/clockSkewMs simulations above actually exercised the
    // freshness window, not just that a message arrived.
    ageMs: (data && typeof data.createdAt === "number") ? now - data.createdAt : null,
    // Object.keys(data) so the runner can assert the trigger is
    // credential-free: exactly channel,version,type,agentType,eventId,createdAt
    // (§4.2), or the equivalent §4.3 shape for the new command-channel types.
    payloadKeys: (data && typeof data === "object") ? Object.keys(data) : [],
  };
  window.__bridgeLog.push(entry);
  render(entry);
  return entry;
}

function showBanner(agentType) {
  const b = document.getElementById("banner");
  b.hidden = false;
  b.textContent = "AUTH DIALOG WOULD OPEN: " + agentType;
}

// window.__launchEventId: the eventId this harness's OWN launch-agent command
// carries (MODE=launch only) — the runner correlates it against the eventual
// agent-ready/launch-failed outcome's eventId (spec §4.3: "outcomes carry no
// identity of their own" beyond the command's eventId).
window.__launchEventId = null;
let launchDriven = false; // single-flight: drive the launch off the FIRST embed-ready only

// driveLaunchOnAnnounce (MODE=launch, spec §4.3): mints a fresh eventId,
// sends set-mode "onboarding" then launch-agent for AGENT straight back to
// the SAME webview that announced (ev.source/ev.origin — mirrors how the
// existing ack path below replies). The happy path targets an
// already-available agent, so there is no auth step to wait on between the
// two sends — the container's own launch gate is identity-only (W10).
function driveLaunchOnAnnounce(ev) {
  if (launchDriven || !ev.source) return;
  launchDriven = true;
  const eventId = crypto.randomUUID();
  window.__launchEventId = eventId;
  const envelope = { channel: BRIDGE_CHANNEL, version: BRIDGE_VERSION, eventId, createdAt: Date.now() };
  ev.source.postMessage(Object.assign({}, envelope, { type: "set-mode", mode: "onboarding" }), ev.origin);
  ev.source.postMessage(Object.assign({}, envelope, { type: "launch-agent", agentId: AGENT }), ev.origin);
}

// ---- receiver (faithful stand-in for the frontend, same decision order) --
window.addEventListener("message", (ev) => {
  const data = ev.data;
  // Not a bridge message at all — ignore silently (VS Code's own webview
  // infra also posts to window.top; those never carry our channel).
  if (!data || typeof data !== "object" || data.channel !== BRIDGE_CHANNEL) return;

  try {
    // 1. Origin: must be the exact code-server origin we embed. No ack. This
    // gate is shared by EVERY bridge message type below — §4.2 acks and the
    // §4.3 command-channel types alike.
    if (ev.origin !== CS_ORIGIN) { record("ignored:origin", ev, data); return; }

    // 2. Shape: version. (channel already matched to enter here; per-type
    // shape/type dispatch follows below.)
    if (data.version !== BRIDGE_VERSION) { record("ignored:shape", ev, data); return; }

    // ---- §4.3 embed command channel (announce/outcome) ------------------
    // A separate dispatch from the §4.2 auth trigger below: no eventId-
    // replay-guard or createdAt-freshness check here — the real container
    // doesn't gate these inbound types on it either (welcome.js's
    // handleSetMode/handleLaunchAgent; §4.1 freshness on inbound commands is
    // a deliberate exclusion, tracked for a later slice with an injectable
    // clock).
    if (data.type === "embed-ready") {
      if (!Array.isArray(data.agents) || typeof data.bootstrapVersion !== "string") {
        record("ignored:shape", ev, data);
        return;
      }
      record("announce", ev, data);
      if (MODE === "launch") driveLaunchOnAnnounce(ev);
      return;
    }
    if (data.type === "agent-ready") {
      if (typeof data.agentId !== "string" || typeof data.eventId !== "string") {
        record("ignored:shape", ev, data);
        return;
      }
      record("agent-ready", ev, data);
      return;
    }
    if (data.type === "launch-failed") {
      if (typeof data.agentId !== "string" || typeof data.eventId !== "string" || typeof data.reason !== "string") {
        record("ignored:shape", ev, data);
        return;
      }
      record("launch-failed", ev, data);
      return;
    }

    // ---- §4.2 auth trigger (unchanged) -----------------------------------
    if (data.type !== "open-agent-auth") { record("ignored:shape", ev, data); return; }

    // 3. eventId (v4, unseen) + createdAt freshness.
    const age = receiverNow() - data.createdAt;
    const freshOk = Number.isFinite(data.createdAt) && age <= MAX_AGE_MS && age >= -MAX_SKEW_MS;
    if (typeof data.eventId !== "string" || !UUID_V4.test(data.eventId) || !freshOk ||
        seenEventIds.has(data.eventId)) {
      record("ignored:eventid", ev, data);
      return;
    }
    seenEventIds.add(data.eventId);

    // 4. agentType: non-empty string, then the supported-set decision.
    if (typeof data.agentType !== "string" || data.agentType === "") {
      record("ignored:agent", ev, data);
      return;
    }

    if (AGENTS.includes(data.agentType)) {
      showBanner(data.agentType);
      record("accept", ev, data);
      if (MODE === "ack" && ev.source) {
        // ackDelayMs mirrors the deployed FE's real contract: it acks
        // accepted:true only AFTER its dialog actually dispatches, not the
        // instant it validates the trigger. Deferred via a plain closure —
        // ev.source/ev.origin/data.eventId are captured now, since `ev`
        // itself is not guaranteed to stay valid past this handler tick.
        const source = ev.source, origin = ev.origin, eventId = data.eventId;
        const sendAcceptedAck = () => source.postMessage(
          { channel: BRIDGE_CHANNEL, version: BRIDGE_VERSION, type: "open-agent-auth-ack",
            eventId, accepted: true },
          origin);
        if (ACK_DELAY_MS > 0) setTimeout(sendAcceptedAck, ACK_DELAY_MS);
        else sendAcceptedAck();
      }
    } else {
      record("reject:unsupported", ev, data);
      if (MODE === "ack" && ev.source) {
        ev.source.postMessage(
          { channel: BRIDGE_CHANNEL, version: BRIDGE_VERSION, type: "open-agent-auth-ack",
            eventId: data.eventId, accepted: false, reason: "unsupported-agent" },
          ev.origin);
      }
    }
  } catch (err) {
    // A receiver must never throw on a hostile/garbled message.
    record("ignored:error", ev, data);
  }
});
</script>
</body></html>
