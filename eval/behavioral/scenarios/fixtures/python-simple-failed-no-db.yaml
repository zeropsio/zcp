# Tier-1 FAILED-state fixture (Phase A of zcp-failed-state-recovery-2026-05-04).
#
# This fixture is INTENTIONALLY broken for behavioural-eval purposes: it imports
# the python-hello-world-app via buildFromGit but omits the `db` service that
# the repo's zerops.yaml hard-references via `${db_hostname}` env vars + a
# migrate.py initCommand. The runtime container builds successfully, then
# crashes on init when migrate.py cannot resolve the database host.
#
# Expected post-seed state (with `seed: settled` runner mode, once shipped):
#   api.status = FAILED   (runtime crashed in initCommands)
#
# This fixture pairs with `recover-failed-buildfromgit-missing-dep.md`. DO NOT
# use it with `seed: deployed` — `waitAllActive` aborts on FAILED and the eval
# cannot proceed.

services:
  - hostname: api
    type: python@3.12
    buildFromGit: https://github.com/zerops-recipe-apps/python-hello-world-app
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      minRam: 0.25
