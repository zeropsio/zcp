services:
  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8080
    depends_on: [api]
  api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://pocasi:pocasi@db:5432/pocasi
    depends_on: [db]
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: pocasi
      POSTGRES_PASSWORD: pocasi
      POSTGRES_DB: pocasi
    volumes:
      - dbdata:/var/lib/postgresql/data
volumes:
  dbdata:
