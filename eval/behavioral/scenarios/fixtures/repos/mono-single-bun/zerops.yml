# F1 (MODEL S1): one part. The dev setup is today's shape; zcp's supervisor
# migration adds the two `zcp-devsup` lines (spec-mate §2.8a.2).
zerops:
  - setup: dev
    build:
      base: bun@1.3
      buildCommands:
        - bun install
      deployFiles: [.]
    run:
      base: bun@1.3
      ports:
        - port: 3000
          httpSupport: true
      start: zsc noop --silent

  - setup: prod
    build:
      base: bun@1.3
      buildCommands:
        - bun install
      deployFiles:
        - index.ts
        - package.json
    run:
      base: bun@1.3
      ports:
        - port: 3000
          httpSupport: true
      start: bun index.ts
