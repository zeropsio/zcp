# Fixture for mono-e4-variantb-shared-volume.md (mono-e0 TEST-PLAN §4 E4,
# F2 under variant B, docs/spec-mate.md §2.8a).
#
# vol: the local-storage service holding the repository. The dev setups of
# the planted repo (fixtures/repos/mono-bun-go-worker/zerops.yml) mount it
# at /var/www/ws on their first deploy — /var/www itself is refused as a
# mountPath (mono-v4 LIVE-PROBE-4 H3).
#
# webdev (Bun, Alpine) runs web + worker, apidev (Go, Ubuntu) runs api:
# two dev services of one pair, each with its own runtime, running and
# empty until their dev setups deploy. One container each, as on the probe.

services:
  - hostname: vol
    type: local-storage:single@1

  - hostname: webdev
    type: bun@1.3
    startWithoutCode: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      minRam: 0.5
      maxRam: 1

  - hostname: apidev
    type: go@1
    startWithoutCode: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      minRam: 0.5
      maxRam: 1
