# Fixture for mono-e1-f1-single.md (mono-e0 TEST-PLAN §2.3 L4, F1):
# one Bun part as a dev/stage pair, both running and empty until their
# setups deploy. The preseed plants fixtures/repos/mono-single-bun on appdev.

services:
  - hostname: appdev
    type: bun@1.3
    startWithoutCode: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      minRam: 0.5
      maxRam: 1

  - hostname: appstage
    type: bun@1.3
    startWithoutCode: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      minRam: 0.5
      maxRam: 1
