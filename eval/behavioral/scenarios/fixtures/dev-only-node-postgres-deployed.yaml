# Single dev-mode Node service + one postgres dep, deployed externally.
# No stage half; tests the launch-production minimal source-state shape:
# sourceContext should auto-suggest the single runtime, no keepNonHA
# question (only one managed dep, default behavior).
#
# Uses the `dev` zeropsSetup block of zerops-recipe-apps/nodejs-hello-world-app
# so the runtime resolves to a non-immutable build (mirrors a "still under
# active development" source ready for first prod launch).

services:
  - hostname: api
    type: nodejs@22
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/nodejs-hello-world-app
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      minRam: 0.5

  - hostname: db
    type: postgresql@18
    mode: NON_HA
    priority: 10
    verticalAutoscaling:
      minRam: 0.25
