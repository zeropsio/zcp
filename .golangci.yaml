version: "2"
run:
  concurrency: 16
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - decorder
    - depguard
    - dogsled
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecksumtype
    - goconst
    - gocritic
    - godox
    - goheader
    - gomodguard
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - importas
    - ineffassign
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - prealloc
    - predeclared
    - reassign
    - revive
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    depguard:
      # Pins the 4-layer architecture documented in CLAUDE.md and
      # docs/spec-architecture.md. Each rule scopes a layer's outgoing
      # imports to what the layer is allowed to depend on.
      rules:
        topology-stdlib-only:
          # Layer 2 — foundational vocabulary. Stdlib + 3rd-party only,
          # never internal/ packages (would create a cycle the moment
          # any other layer imported topology/, which they all do).
          list-mode: lax
          files:
            - "**/internal/topology/**/*.go"
          deny:
            - pkg: github.com/zeropsio/zcp/internal
              desc: "topology/ is layer-2 vocabulary; imports stdlib + 3rd-party only"
        platform-no-internal:
          # Layer 1 — raw Zerops API. Stdlib + 3rd-party only.
          list-mode: lax
          files:
            - "**/internal/platform/**/*.go"
          deny:
            - pkg: github.com/zeropsio/zcp/internal
              desc: "platform/ is layer 1; no internal/ imports allowed"
        ops-not-workflow:
          # Layer 3 peer — must NOT import its peer (workflow/) nor any
          # upper-layer package (tools/, authoring/).
          list-mode: lax
          files:
            - "**/internal/ops/*.go"
            - "**/internal/ops/**/*.go"
          deny:
            - pkg: github.com/zeropsio/zcp/internal/workflow
              desc: "ops/ and workflow/ are peer layer-3 packages; share types via topology/"
            - pkg: github.com/zeropsio/zcp/internal/tools
              desc: "ops/ is layer 3; tools/ is layer 4 entry"
            - pkg: github.com/zeropsio/zcp/internal/authoring
              desc: "ops/ is layer 3; authoring/ is the gated maintainer domain (boundary L1)"
        workflow-not-ops:
          # Layer 3 peer — must NOT import its peer (ops/) nor any
          # upper-layer package (tools/, authoring/).
          list-mode: lax
          files:
            - "**/internal/workflow/**/*.go"
          deny:
            - pkg: github.com/zeropsio/zcp/internal/ops
              desc: "workflow/ and ops/ are peer layer-3 packages; share types via topology/"
            - pkg: github.com/zeropsio/zcp/internal/tools
              desc: "workflow/ is layer 3; tools/ is layer 4 entry"
            - pkg: github.com/zeropsio/zcp/internal/authoring
              desc: "workflow/ is layer 3; authoring/ is the gated maintainer domain (boundary L1)"
        core-not-authoring:
          # Authoring boundary, direction 1 (L1 in
          # docs/spec-authoring-boundary.md): no core package depends on
          # the maintainer-only authoring domain. The single composition
          # root is internal/server (gated registration + probe wiring);
          # cmd/ and tools/lint/ sit outside the rule and carry the
          # CLI/repo-tooling wiring. The repo-root test harnesses
          # (integration/, e2e/) are covered: they exercise authoring
          # only through the composed server, never by import.
          list-mode: lax
          files:
            - "**/internal/**/*.go"
            - "!**/internal/authoring/*.go"
            - "!**/internal/authoring/**/*.go"
            - "!**/internal/server/*.go"
            - "!**/internal/server/**/*.go"
            - "**/integration/*.go"
            - "**/integration/**/*.go"
            - "**/e2e/*.go"
            - "**/e2e/**/*.go"
          deny:
            - pkg: github.com/zeropsio/zcp/internal/authoring
              desc: "core must not import the authoring domain; only internal/server composes it"
        authoring-allowlist:
          # Authoring boundary, direction 2 (L2): the authoring domain
          # reaches core only through an enumerated allowlist. Adding an
          # entry here is a deliberate contract change — update
          # docs/spec-authoring-boundary.md alongside.
          list-mode: strict
          files:
            - "**/internal/authoring/*.go"
            - "**/internal/authoring/**/*.go"
          allow:
            - $gostd
            - github.com/zeropsio/zcp/internal/authoring
            - github.com/zeropsio/zcp/internal/topology
            - github.com/zeropsio/zcp/internal/schema
            - github.com/zeropsio/zcp/internal/knowledge
            - github.com/zeropsio/zcp/internal/platform
            - github.com/zeropsio/zcp/internal/sync
            - github.com/modelcontextprotocol/go-sdk
            # jsonschema-go is the mcp go-sdk's own schema vocabulary —
            # mcp.Tool.InputSchema IS *jsonschema.Schema, so a gated tool
            # that publishes a custom input schema (FlexBool oneOf patch)
            # cannot avoid it.
            - github.com/google/jsonschema-go
            - gopkg.in/yaml.v3
        core-not-capture-inspector:
          # Capture Inspector is a cold CLI-only domain. The exact composition
          # adapter is cmd/zcp/capture_ui.go; primary MCP/server/core packages
          # and all other entrypoints must not depend on it.
          list-mode: lax
          files:
            - "**/internal/**/*.go"
            - "!**/internal/captureinspector/*.go"
            - "!**/internal/captureinspector/**/*.go"
            - "**/cmd/**/*.go"
            - "!**/cmd/zcp/capture_ui.go"
            - "**/integration/*.go"
            - "**/integration/**/*.go"
            - "**/e2e/*.go"
            - "**/e2e/**/*.go"
          deny:
            - pkg: github.com/zeropsio/zcp/internal/captureinspector
              desc: "captureinspector is a cold internal tool; only cmd/zcp/capture_ui.go composes it"
        capture-inspector-allowlist:
          # The inspector may read the canonical capture contract but may not
          # reach MCP server, tools, ops, workflow, eval, or product domains.
          # projection/web are additionally compiler-fenced by nested internal/.
          list-mode: strict
          files:
            - "**/internal/captureinspector/*.go"
            - "**/internal/captureinspector/**/*.go"
          allow:
            - $gostd
            - github.com/zeropsio/zcp/internal/captureinspector
            - github.com/zeropsio/zcp/internal/capture
        dataconsole-core-isolated:
          # Data Console boundary, direction 1: the extractable engine
          # (internal/dataconsole/console/**) imports ZERO zcp core — only
          # stdlib + 3rd-party drivers + its own subtree — so it lifts to its
          # own repo with a `git mv`. The zcpadapter is the only bridge.
          # Pinned alongside by TestDataConsoleBoundary_CoreIsolated.
          list-mode: strict
          files:
            - "**/internal/dataconsole/console/*.go"
            - "**/internal/dataconsole/console/**/*.go"
          allow:
            - $gostd
            - github.com/zeropsio/zcp/internal/dataconsole/console
            - github.com/minio/minio-go
            - github.com/jackc/pgx
            - github.com/go-sql-driver/mysql
            - github.com/redis/go-redis
            - github.com/alicebob/miniredis # test-only: hermetic Valkey for the kv contract suite
            - github.com/ClickHouse/clickhouse-go
            - github.com/segmentio/kafka-go
            - github.com/nats-io/nats.go
        dataconsole-adapter-allowlist:
          # Direction 2: the adapter reaches core only through this enumerated
          # allowlist. Adding an entry is a deliberate contract change.
          list-mode: strict
          files:
            - "**/internal/dataconsole/zcpadapter/*.go"
            - "**/internal/dataconsole/zcpadapter/**/*.go"
          allow:
            - $gostd
            - github.com/zeropsio/zcp/internal/dataconsole/console
            - github.com/zeropsio/zcp/internal/dataconsole/console/provider
            - github.com/zeropsio/zcp/internal/auth
            - github.com/zeropsio/zcp/internal/ops
            - github.com/zeropsio/zcp/internal/platform
            - github.com/zeropsio/zcp/internal/topology
        core-not-dataconsole:
          # Data Console boundary, the OUTER island: the extractable subsystem
          # (internal/dataconsole/**) is composed at only a handful of sites — the
          # `zcp studio` CLI, the dcseed seed tool, and the init studio install
          # adapter. No other core / MCP / server / integration / e2e package may
          # import it, so the whole subsystem lifts to its own repo without
          # unpicking core. (The inner dataconsole-core-isolated /
          # dataconsole-adapter-allowlist rules pin the engine↔adapter seam INSIDE
          # the subsystem; this pins the core↔subsystem seam AROUND it.) Pinned
          # alongside by TestDataConsoleBoundary_CoreDoesNotImportSubsystem, which
          # covers the same import set so a config drift can't silently open it.
          list-mode: lax
          files:
            - "**/internal/**/*.go"
            - "!**/internal/dataconsole/*.go"
            - "!**/internal/dataconsole/**/*.go"
            - "!**/internal/init/adapters/studio.go"
            - "!**/internal/init/adapters/studio_test.go" # version-parity test reads the embedded package.json
            - "!**/internal/init/vscode.go"
            - "**/cmd/**/*.go"
            - "!**/cmd/zcp/studio.go"
            - "!**/cmd/zcp/studio_console.go"
            - "!**/cmd/dcseed/*.go"
            - "!**/cmd/dcseed/**/*.go"
            - "**/integration/*.go"
            - "**/integration/**/*.go"
            - "**/e2e/*.go"
            - "**/e2e/**/*.go"
          deny:
            - pkg: github.com/zeropsio/zcp/internal/dataconsole
              desc: "dataconsole is the extractable Data Console subsystem; only the studio CLI (cmd/zcp/studio*.go), dcseed, and the init studio adapter compose it"
    goconst:
      min-len: 3
      min-occurrences: 3
    godox:
      keywords:
        - FIXME
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errorlint
          - forcetypeassert
        path: _test\.go
      - linters:
          - gosec
        path: _test\.go
        text: 'G306:'
      - linters:
          - gosec
        path: testutil/
        text: 'G306:'
      - linters:
          - goconst
        path: _test\.go
      # workflow.go is the action dispatcher: action / strategy / workflow
      # name strings are intentionally inline (duplicated across the tool
      # schema, the switch, and atom-accepted lists) because the
      # TestAtomLintAccepted*MatchDispatcher tests pin them at the AST
      # *ast.BasicLit level — promoting to constants breaks those pins.
      # An in-file //nolint is mis-attributed by nolintlint here, so the
      # suppression lives in config.
      - linters:
          - goconst
        path: internal/tools/workflow\.go
      # SA5011 in test files — the idiomatic `if x == nil { t.Fatalf(...) }
      # ; x.Field` pattern relies on t.Fatalf calling runtime.Goexit, which
      # staticcheck v0.5 (bundled with golangci-lint v2.8) doesn't always
      # recognize as terminating across subtest closures. Bulk-suppressing
      # SA5011 in _test.go to keep the test surface readable; production
      # code still gets the check.
      - linters:
          - staticcheck
        path: _test\.go
        text: 'SA5011'
      - linters:
          - gosec
        text: 'G101:'
      - linters:
          - gosec
        text: 'G115:'
      - linters:
          - revive
        path: internal/platform/client\.go
        text: 'var-naming: struct field'
      - linters:
          - revive
        text: 'exported: type name will be used as'
      # The v3 run-analysis harness PARSES external agent session-log
      # tool-call records, whose keys are snake_case in the source format
      # (e.g. the file tools emit input.file_path). The struct tags must
      # match those source keys byte-for-byte — camelCase would break the
      # unmarshal — so tagliatelle's camelCase rule is excluded here.
      - linters:
          - tagliatelle
        path: internal/authoring/analyze/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
