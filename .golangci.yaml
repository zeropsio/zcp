version: "2"
run:
  concurrency: 16
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - decorder
    - depguard
    - dogsled
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecksumtype
    - goconst
    - gocritic
    - godox
    - goheader
    - gomodguard
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - importas
    - ineffassign
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - prealloc
    - predeclared
    - reassign
    - revive
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    depguard:
      # Pins the 4-layer architecture documented in CLAUDE.md and
      # docs/spec-architecture.md. Each rule scopes a layer's outgoing
      # imports to what the layer is allowed to depend on.
      rules:
        topology-stdlib-only:
          # Layer 2 — foundational vocabulary. Stdlib + 3rd-party only,
          # never internal/ packages (would create a cycle the moment
          # any other layer imported topology/, which they all do).
          list-mode: lax
          files:
            - "**/internal/topology/**/*.go"
          deny:
            - pkg: github.com/zeropsio/zcp/internal
              desc: "topology/ is layer-2 vocabulary; imports stdlib + 3rd-party only"
        platform-no-internal:
          # Layer 1 — raw Zerops API. Stdlib + 3rd-party only.
          list-mode: lax
          files:
            - "**/internal/platform/**/*.go"
          deny:
            - pkg: github.com/zeropsio/zcp/internal
              desc: "platform/ is layer 1; no internal/ imports allowed"
        ops-not-workflow:
          # Layer 3 peer — must NOT import its peer (workflow/) nor any
          # upper-layer package (tools/, authoring/).
          list-mode: lax
          files:
            - "**/internal/ops/*.go"
          deny:
            - pkg: github.com/zeropsio/zcp/internal/workflow
              desc: "ops/ and workflow/ are peer layer-3 packages; share types via topology/"
            - pkg: github.com/zeropsio/zcp/internal/tools
              desc: "ops/ is layer 3; tools/ is layer 4 entry"
            - pkg: github.com/zeropsio/zcp/internal/authoring
              desc: "ops/ is layer 3; authoring/ is the gated maintainer domain (boundary L1)"
        ops-checks-legacy:
          # Sub-package ops/checks/ holds recipe v2 check producers that
          # must keep importing workflow/ for the StepCheck types until
          # recipe v2 is deleted. The exemption is workflow-only —
          # importing tools/ or authoring/ from a check would still be a
          # layering violation, so we deny those explicitly here.
          list-mode: lax
          files:
            - "**/internal/ops/checks/*.go"
          deny:
            - pkg: github.com/zeropsio/zcp/internal/tools
              desc: "ops/checks/ is layer 3 (recipe v2 legacy); tools/ is layer 4 entry"
            - pkg: github.com/zeropsio/zcp/internal/authoring
              desc: "ops/checks/ is layer 3 (recipe v2 legacy); authoring/ is the gated maintainer domain (boundary L1)"
        workflow-not-ops:
          # Layer 3 peer — must NOT import its peer (ops/) nor any
          # upper-layer package (tools/, authoring/).
          list-mode: lax
          files:
            - "**/internal/workflow/**/*.go"
          deny:
            - pkg: github.com/zeropsio/zcp/internal/ops
              desc: "workflow/ and ops/ are peer layer-3 packages; share types via topology/"
            - pkg: github.com/zeropsio/zcp/internal/tools
              desc: "workflow/ is layer 3; tools/ is layer 4 entry"
            - pkg: github.com/zeropsio/zcp/internal/authoring
              desc: "workflow/ is layer 3; authoring/ is the gated maintainer domain (boundary L1)"
        core-not-authoring:
          # Authoring boundary, direction 1 (L1 in
          # docs/spec-authoring-boundary.md): no core package depends on
          # the maintainer-only authoring domain. The single composition
          # root is internal/server (gated registration + probe wiring);
          # cmd/ and tools/lint/ sit outside the rule and carry the
          # CLI/repo-tooling wiring. The repo-root test harnesses
          # (integration/, e2e/) are covered: they exercise authoring
          # only through the composed server, never by import.
          list-mode: lax
          files:
            - "**/internal/**/*.go"
            - "!**/internal/authoring/*.go"
            - "!**/internal/authoring/**/*.go"
            - "!**/internal/server/*.go"
            - "!**/internal/server/**/*.go"
            - "**/integration/*.go"
            - "**/integration/**/*.go"
            - "**/e2e/*.go"
            - "**/e2e/**/*.go"
          deny:
            - pkg: github.com/zeropsio/zcp/internal/authoring
              desc: "core must not import the authoring domain; only internal/server composes it"
        authoring-allowlist:
          # Authoring boundary, direction 2 (L2): the authoring domain
          # reaches core only through an enumerated allowlist. Adding an
          # entry here is a deliberate contract change — update
          # docs/spec-authoring-boundary.md alongside.
          list-mode: strict
          files:
            - "**/internal/authoring/*.go"
            - "**/internal/authoring/**/*.go"
          allow:
            - $gostd
            - github.com/zeropsio/zcp/internal/authoring
            - github.com/zeropsio/zcp/internal/topology
            - github.com/zeropsio/zcp/internal/schema
            - github.com/zeropsio/zcp/internal/knowledge
            - github.com/zeropsio/zcp/internal/platform
            - github.com/zeropsio/zcp/internal/workflow
            - github.com/zeropsio/zcp/internal/sync
            - github.com/modelcontextprotocol/go-sdk
            - gopkg.in/yaml.v3
    goconst:
      min-len: 3
      min-occurrences: 3
    godox:
      keywords:
        - FIXME
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errorlint
          - forcetypeassert
        path: _test\.go
      - linters:
          - gosec
        path: _test\.go
        text: 'G306:'
      - linters:
          - gosec
        path: testutil/
        text: 'G306:'
      - linters:
          - goconst
        path: _test\.go
      # workflow.go is the action dispatcher: action / strategy / workflow
      # name strings are intentionally inline (duplicated across the tool
      # schema, the switch, and atom-accepted lists) because the
      # TestAtomLintAccepted*MatchDispatcher tests pin them at the AST
      # *ast.BasicLit level — promoting to constants breaks those pins.
      # An in-file //nolint is mis-attributed by nolintlint here, so the
      # suppression lives in config.
      - linters:
          - goconst
        path: internal/tools/workflow\.go
      # SA5011 in test files — the idiomatic `if x == nil { t.Fatalf(...) }
      # ; x.Field` pattern relies on t.Fatalf calling runtime.Goexit, which
      # staticcheck v0.5 (bundled with golangci-lint v2.8) doesn't always
      # recognize as terminating across subtest closures. Bulk-suppressing
      # SA5011 in _test.go to keep the test surface readable; production
      # code still gets the check.
      - linters:
          - staticcheck
        path: _test\.go
        text: 'SA5011'
      - linters:
          - gosec
        text: 'G101:'
      - linters:
          - gosec
        text: 'G115:'
      - linters:
          - revive
        path: internal/platform/client\.go
        text: 'var-naming: struct field'
      - linters:
          - revive
        text: 'exported: type name will be used as'
      # The analyze package emits a spec-defined JSON schema with
      # snake_case keys (see docs/zcprecipator2/spec-recipe-analysis-harness.md §2).
      # Keys like B-15_ghost_env_dirs are analyst citation anchors and
      # must match the spec byte-for-byte — camelCase would break the
      # verdict-to-evidence binding the harness is built to enforce.
      - linters:
          - tagliatelle
        path: internal/authoring/analyze/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
