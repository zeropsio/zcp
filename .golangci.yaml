version: "2"
run:
  concurrency: 16
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - decorder
    - depguard
    - dogsled
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecksumtype
    - goconst
    - gocritic
    - godox
    - goheader
    - gomodguard
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - importas
    - ineffassign
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - prealloc
    - predeclared
    - reassign
    - revive
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    depguard:
      # Pins the 4-layer architecture documented in CLAUDE.md and
      # docs/spec-architecture.md. Each rule scopes a layer's outgoing
      # imports to what the layer is allowed to depend on.
      rules:
        topology-stdlib-only:
          # Layer 2 — foundational vocabulary. Stdlib + 3rd-party only,
          # never internal/ packages (would create a cycle the moment
          # any other layer imported topology/, which they all do).
          #
          # Both a direct-children glob and a nested-**-glob are required:
          # gobwas/glob's "**" needs a path segment on each side, so
          # "**/internal/topology/**/*.go" alone never matches files
          # sitting directly in internal/topology/ (only in subdirs).
          list-mode: lax
          files:
            - "**/internal/topology/*.go"
            - "**/internal/topology/**/*.go"
          allow:
            - github.com/zeropsio/zcp/internal/topology
          deny:
            - pkg: github.com/zeropsio/zcp/internal
              desc: "topology/ is layer-2 vocabulary; imports stdlib + 3rd-party only"
        platform-no-internal:
          # Layer 1 — raw Zerops API. Stdlib + 3rd-party only.
          #
          # Both a direct-children glob and a nested-**-glob are required;
          # see topology-stdlib-only above for why.
          list-mode: lax
          files:
            - "**/internal/platform/*.go"
            - "**/internal/platform/**/*.go"
          allow:
            - github.com/zeropsio/zcp/internal/platform
          deny:
            - pkg: github.com/zeropsio/zcp/internal
              desc: "platform/ is layer 1; no internal/ imports allowed"
        ops-not-workflow:
          # Layer 3 peer — must NOT import its peer (workflow/) nor any
          # upper-layer package (tools/, authoring/). Also must not import
          # telemetry — instrumentation stays at the L4 choke point
          # (internal/server middleware), spec-telemetry.md §5.3.
          list-mode: lax
          files:
            - "**/internal/ops/*.go"
            - "**/internal/ops/**/*.go"
          deny:
            - pkg: github.com/zeropsio/zcp/internal/workflow
              desc: "ops/ and workflow/ are peer layer-3 packages; share types via topology/"
            - pkg: github.com/zeropsio/zcp/internal/tools
              desc: "ops/ is layer 3; tools/ is layer 4 entry"
            - pkg: github.com/zeropsio/zcp/internal/authoring
              desc: "ops/ is layer 3; authoring/ is the gated maintainer domain (boundary L1)"
            - pkg: github.com/zeropsio/zcp/internal/telemetry
              desc: "ops/ must not import telemetry; instrumentation stays at the L4 choke point (spec-telemetry.md §5.3)"
        workflow-not-ops:
          # Layer 3 peer — must NOT import its peer (ops/) nor any
          # upper-layer package (tools/, authoring/). Also must not import
          # telemetry — instrumentation stays at the L4 choke point
          # (internal/server middleware), spec-telemetry.md §5.3.
          # Two file globs (direct children + nested subdirs), same shape
          # as ops-not-workflow above and wire-stdlib-only below: a single
          # "**/internal/workflow/**/*.go" pattern never matches internal/
          # workflow/'s own .go files (all of them live directly in the
          # package root; gobwas/glob requires >=1 path segment on each
          # side of a bare "**") — proven live while wiring this rule; the
          # single-pattern form silently never applied to any workflow/
          # file.
          list-mode: lax
          files:
            - "**/internal/workflow/*.go"
            - "**/internal/workflow/**/*.go"
          deny:
            - pkg: github.com/zeropsio/zcp/internal/ops
              desc: "workflow/ and ops/ are peer layer-3 packages; share types via topology/"
            - pkg: github.com/zeropsio/zcp/internal/tools
              desc: "workflow/ is layer 3; tools/ is layer 4 entry"
            - pkg: github.com/zeropsio/zcp/internal/authoring
              desc: "workflow/ is layer 3; authoring/ is the gated maintainer domain (boundary L1)"
            - pkg: github.com/zeropsio/zcp/internal/telemetry
              desc: "workflow/ must not import telemetry; instrumentation stays at the L4 choke point (spec-telemetry.md §5.3)"
        wire-stdlib-only:
          # internal/telemetry/wire is the single schema + validation owner
          # imported by both the telemetry client and cmd/zcp-ingest
          # (spec-telemetry.md §4.3) — stdlib + 3rd-party only. Two file
          # globs (direct children + nested subdirs), same shape as
          # ops-not-workflow below — a single "**/X/**/*.go" pattern (as
          # topology-stdlib-only/platform-no-internal/workflow-not-ops use)
          # does NOT match files directly inside X/ under this linter's glob
          # engine (gobwas/glob requires >=1 path segment on each side of a
          # bare "**"), which is exactly where every current wire/*.go file
          # lives — verified live before relying on it (see
          # architecture_test.go's Go-level TestArchitectureLayering for the
          # engine-independent enforcement of this same invariant).
          # The self-package allow entry is required because, unlike
          # topology-stdlib-only/platform-no-internal (whose glob gap above
          # happens to never apply the rule to their own package-root test
          # files), this rule DOES apply to wire/'s own *_test.go files,
          # which legitimately self-import "wire" as an external test
          # package (wire_test) — depguard's lax list-mode resolves a
          # deny/allow overlap by specificity (longer prefix wins), so the
          # exact self-package allow entry beats the broad "internal" deny.
          list-mode: lax
          files:
            - "**/internal/telemetry/wire/*.go"
            - "**/internal/telemetry/wire/**/*.go"
          allow:
            - github.com/zeropsio/zcp/internal/telemetry/wire
          deny:
            - pkg: github.com/zeropsio/zcp/internal
              desc: "wire/ is the schema/validation single owner shared by the client and ingest; imports stdlib + 3rd-party only"
        ingest-allowlist:
          # cmd/zcp-ingest's ingest service (spec-telemetry.md §6) is a
          # standalone process — its only internal/ dependency is the wire
          # package (schema + strict validation, the single owner per
          # spec-telemetry.md §4.3). Denying everything else keeps the
          # ingest binary decoupled from the rest of ZCP (it does not link
          # ops/, workflow/, tools/, platform/, etc). Mirrors the
          # authoring-allowlist strict-list-mode style below.
          list-mode: strict
          files:
            - "**/internal/ingest/*.go"
            - "**/internal/ingest/**/*.go"
          allow:
            - $gostd
            - github.com/zeropsio/zcp/internal/ingest
            - github.com/zeropsio/zcp/internal/telemetry/wire
            - github.com/ClickHouse/clickhouse-go/v2
            - github.com/google/uuid
        core-not-authoring:
          # Authoring boundary, direction 1 (L1 in
          # docs/spec-authoring-boundary.md): no core package depends on
          # the maintainer-only authoring domain. The single composition
          # root is internal/server (gated registration + probe wiring);
          # cmd/ and tools/lint/ sit outside the rule and carry the
          # CLI/repo-tooling wiring. The repo-root test harnesses
          # (integration/, e2e/) are covered: they exercise authoring
          # only through the composed server, never by import.
          list-mode: lax
          files:
            - "**/internal/**/*.go"
            - "!**/internal/authoring/*.go"
            - "!**/internal/authoring/**/*.go"
            - "!**/internal/server/*.go"
            - "!**/internal/server/**/*.go"
            - "**/integration/*.go"
            - "**/integration/**/*.go"
            - "**/e2e/*.go"
            - "**/e2e/**/*.go"
          deny:
            - pkg: github.com/zeropsio/zcp/internal/authoring
              desc: "core must not import the authoring domain; only internal/server composes it"
        authoring-allowlist:
          # Authoring boundary, direction 2 (L2): the authoring domain
          # reaches core only through an enumerated allowlist. Adding an
          # entry here is a deliberate contract change — update
          # docs/spec-authoring-boundary.md alongside.
          list-mode: strict
          files:
            - "**/internal/authoring/*.go"
            - "**/internal/authoring/**/*.go"
          allow:
            - $gostd
            - github.com/zeropsio/zcp/internal/authoring
            - github.com/zeropsio/zcp/internal/topology
            - github.com/zeropsio/zcp/internal/schema
            - github.com/zeropsio/zcp/internal/knowledge
            - github.com/zeropsio/zcp/internal/platform
            - github.com/zeropsio/zcp/internal/sync
            - github.com/modelcontextprotocol/go-sdk
            # jsonschema-go is the mcp go-sdk's own schema vocabulary —
            # mcp.Tool.InputSchema IS *jsonschema.Schema, so a gated tool
            # that publishes a custom input schema (FlexBool oneOf patch)
            # cannot avoid it.
            - github.com/google/jsonschema-go
            - gopkg.in/yaml.v3
    goconst:
      min-len: 3
      min-occurrences: 3
    godox:
      keywords:
        - FIXME
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errorlint
          - forcetypeassert
        path: _test\.go
      - linters:
          - gosec
        path: _test\.go
        text: 'G306:'
      - linters:
          - gosec
        path: testutil/
        text: 'G306:'
      - linters:
          - goconst
        path: _test\.go
      # workflow.go is the action dispatcher: action / strategy / workflow
      # name strings are intentionally inline (duplicated across the tool
      # schema, the switch, and atom-accepted lists) because the
      # TestAtomLintAccepted*MatchDispatcher tests pin them at the AST
      # *ast.BasicLit level — promoting to constants breaks those pins.
      # An in-file //nolint is mis-attributed by nolintlint here, so the
      # suppression lives in config.
      - linters:
          - goconst
        path: internal/tools/workflow\.go
      # SA5011 in test files — the idiomatic `if x == nil { t.Fatalf(...) }
      # ; x.Field` pattern relies on t.Fatalf calling runtime.Goexit, which
      # staticcheck v0.5 (bundled with golangci-lint v2.8) doesn't always
      # recognize as terminating across subtest closures. Bulk-suppressing
      # SA5011 in _test.go to keep the test surface readable; production
      # code still gets the check.
      - linters:
          - staticcheck
        path: _test\.go
        text: 'SA5011'
      - linters:
          - gosec
        text: 'G101:'
      - linters:
          - gosec
        text: 'G115:'
      - linters:
          - revive
        path: internal/platform/client\.go
        text: 'var-naming: struct field'
      - linters:
          - revive
        text: 'exported: type name will be used as'
      # The v3 run-analysis harness PARSES external agent session-log
      # tool-call records, whose keys are snake_case in the source format
      # (e.g. the file tools emit input.file_path). The struct tags must
      # match those source keys byte-for-byte — camelCase would break the
      # unmarshal — so tagliatelle's camelCase rule is excluded here.
      - linters:
          - tagliatelle
        path: internal/authoring/analyze/
      # internal/telemetry/wire and internal/ingest carry the wire-protocol
      # structs (Event/Batch/IngestResponse, spec-telemetry.md §4.1-§4.4):
      # snake_case JSON tags are the ClickHouse-side/ingest interop
      # contract, not a Go naming choice — camelCase would break the wire
      # shape both the client and the ingest service depend on.
      - linters:
          - tagliatelle
        path: internal/telemetry/wire/
      - linters:
          - tagliatelle
        path: internal/ingest/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
