name: Release on green

# When main's CI concludes green, cut the next release of that commit, unless the commits since the
# last release change what zcp shows agents (cmd/release-on-green names those paths): their release
# waits for the live check of a Mate and of a standalone zcp, and a person cuts it with `make release`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

# One cut at a time; a second green run queues behind and finds its commit already released.
concurrency:
  group: release-on-green
  cancel-in-progress: false

jobs:
  cut:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: false

      # A tag pushed with the workflow token starts no workflow, so the release is dispatched on it.
      - name: Tag and dispatch the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag=$(go run ./cmd/release-on-green "$SHA")
          [ -n "$tag" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag" "$SHA"
          git push origin "refs/tags/$tag"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
          echo "Released $tag from $SHA" >> "$GITHUB_STEP_SUMMARY"
