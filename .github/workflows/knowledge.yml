name: Prepare knowledge

on:
  workflow_call:
    inputs:
      # Release: require the exact commit's green verdict, waiting if CI runs.
      reuse-ci:
        type: boolean
        default: false
      # Push to main: reuse a pull request's green verdict for the same tree, if any.
      reuse-tree:
        type: boolean
        default: false
    outputs:
      artifact:
        value: ${{ jobs.prepare.outputs.artifact }}
      digest:
        value: ${{ jobs.prepare.outputs.digest }}
      reused:
        value: ${{ jobs.prepare.outputs.reused }}

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      artifact: ${{ steps.publish.outputs.artifact }}
      digest: ${{ steps.publish.outputs.digest }}
      reused: ${{ steps.verify.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve source commit
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Reuse a green CI verdict (release waits for its exact commit)
        if: inputs.reuse-ci || inputs.reuse-tree
        id: proof
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
          REUSE_MODE: ${{ inputs.reuse-ci && 'commit' || 'tree' }}
        with:
          script: |
            const { requireCorpus, selectTreeCorpus } = require('./.github/scripts/select-corpus.cjs');
            const { SOURCE_SHA, SOURCE_TREE, REUSE_MODE } = process.env;
            const proof = REUSE_MODE === 'commit'
              ? await requireCorpus(github, context.repo, SOURCE_SHA)
              : await selectTreeCorpus(github, context.repo, SOURCE_SHA, SOURCE_TREE);
            if (proof) {
              core.setOutput('run-id', proof.runID);
              core.setOutput('artifact', proof.artifactName);
              core.setOutput('digest', proof.digest);
            } else {
              core.info(`No green CI verdict for tree ${SOURCE_TREE}; testing it in full`);
            }

      - name: Download proven corpus
        if: steps.proof.outputs.artifact != ''
        id: download
        uses: actions/download-artifact@v7
        with:
          name: ${{ steps.proof.outputs.artifact }}
          run-id: ${{ steps.proof.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/knowledge

      - name: Verify proven corpus
        if: steps.download.outcome == 'success'
        id: verify
        env:
          CORPUS_DIGEST: ${{ steps.proof.outputs.digest }}
        working-directory: ${{ runner.temp }}/knowledge
        run: printf '%s  corpus.tar\n' "$CORPUS_DIGEST" | sha256sum --check --strict

      - uses: actions/setup-go@v6
        if: steps.verify.outcome != 'success'
        with:
          go-version-file: go.mod

      - name: Pull and freeze knowledge once
        if: steps.verify.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          go run ./cmd/zcp sync pull
          # Sync may overwrite tracked overrides; the source revision owns them.
          git restore --source=HEAD --worktree -- internal/knowledge
          mkdir -p "$RUNNER_TEMP/knowledge"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf "$RUNNER_TEMP/knowledge/corpus.tar" -C internal/knowledge \
            themes bases recipes guides decisions playbooks

      - name: Publish corpus identity
        id: publish
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          REUSED: ${{ steps.verify.outcome == 'success' }}
        run: |
          set -euo pipefail
          digest=$(sha256sum "$RUNNER_TEMP/knowledge/corpus.tar" | cut -d ' ' -f 1)
          artifact="knowledge-v1-${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          printf 'Corpus: %s\nSHA-256: %s\nReused full CI: %s\n' \
            "$artifact" "$digest" "$REUSED" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.publish.outputs.artifact }}
          path: ${{ runner.temp }}/knowledge/corpus.tar
          if-no-files-found: error
          retention-days: 30
