name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    with:
      reuse-ci: true

  build:
    name: build ${{ matrix.name }}
    needs: validation
    runs-on: ubuntu-22.04
    env:
      CGO_ENABLED: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux amd64
            env: { GOOS: linux, GOARCH: amd64 }
            file: zcp-linux-amd64
            compress: true
            strip: true
          - name: darwin amd64
            env: { GOOS: darwin, GOARCH: amd64 }
            file: zcp-darwin-amd64
            compress: false
            strip: false
          - name: darwin arm64
            env: { GOOS: darwin, GOARCH: arm64 }
            file: zcp-darwin-arm64
            compress: false
            strip: false
          - name: windows amd64
            env: { GOOS: windows, GOARCH: amd64 }
            file: zcp-win-x64.exe
            compress: false
            strip: false
          # The dev-server supervisor a dev setup downloads in its
          # prepareCommands (docs/spec-mate.md §2.8a.2).
          - name: zcp-devsup linux amd64
            env: { GOOS: linux, GOARCH: amd64 }
            file: zcp-devsup-linux-amd64
            pkg: ./cmd/zcp-devsup
            compress: false
            strip: false

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - uses: ./.github/actions/restore-knowledge
        with:
          artifact: ${{ needs.validation.outputs.corpus-artifact }}
          digest: ${{ needs.validation.outputs.corpus-digest }}

      # NOTE: Module path must match MODULE in Makefile (github.com/zeropsio/zcp)
      - name: Build
        env: ${{ matrix.env }}
        run: >-
          go build
          -o builds/${{ matrix.file }}
          -ldflags "-s -w
          -X github.com/zeropsio/zcp/internal/server.Version=${{ github.ref_name }}
          -X github.com/zeropsio/zcp/internal/server.Commit=${{ github.sha }}
          -X github.com/zeropsio/zcp/internal/server.Built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          -X main.version=${{ github.ref_name }}"
          ${{ matrix.pkg || './cmd/zcp' }}

      # UPX is fetched here rather than through svenstaro/upx-action: that
      # action curls the release tarball with no retry, so a single TLS reset
      # from release-assets.githubusercontent.com fails the whole release
      # (v9.160.0 died exactly there, curl exit 35 — GitHub's CDN, not us).
      # Same pinned UPX, now with retries and a verified digest, so a tarball
      # swapped under the tag can't reach the binary we ship.
      - name: Compress binary
        if: ${{ matrix.compress }}
        env:
          UPX_VERSION: '4.2.2'
          UPX_SHA256: 915c8e844f835de03b9cc311ff185aedec79d757aee9d7133a528b9e89c463bb
        run: |
          set -euo pipefail
          tarball="upx-${UPX_VERSION}-amd64_linux.tar.xz"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${tarball}"
          echo "${UPX_SHA256}  ${tarball}" | sha256sum -c -
          tar -xJf "${tarball}"
          strip "builds/${{ matrix.file }}"
          "upx-${UPX_VERSION}-amd64_linux/upx" "builds/${{ matrix.file }}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.file }}
          path: ./builds/${{ matrix.file }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - uses: actions/download-artifact@v7
        with:
          path: ./builds
          pattern: zcp-*
          merge-multiple: true

      - name: Require a compatible published Mate
        run: go run ./cmd/mate-release-check

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ github.ref_name }}"
          ./builds/*
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --generate-notes
