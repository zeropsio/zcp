name: CI

on:
  push:
    branches: [main, 'wt/keys']
  pull_request:
    branches: ['*']
  workflow_dispatch:
  workflow_call:
    inputs:
      reuse-ci:
        type: boolean
        default: false
    outputs:
      corpus-artifact:
        value: ${{ jobs.knowledge.outputs.artifact }}
      corpus-digest:
        value: ${{ jobs.knowledge.outputs.digest }}

permissions:
  contents: read
  actions: read

# Only the newest main push needs a verdict: it cancels older main runs, queued or running.
# Every other run (pull request, dispatch, wt/keys, a release's call) has a group of its own.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  cancel-in-progress: true

jobs:
  knowledge:
    uses: ./.github/workflows/knowledge.yml
    with:
      reuse-ci: ${{ inputs.reuse-ci || false }}
      reuse-tree: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  build:
    name: build
    needs: knowledge
    if: needs.knowledge.outputs.reused != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - uses: ./.github/actions/restore-knowledge
        with:
          artifact: ${{ needs.knowledge.outputs.artifact }}
          digest: ${{ needs.knowledge.outputs.digest }}

      - name: Build (all platforms)
        env:
          CGO_ENABLED: '0'
        run: |
          GOOS=linux GOARCH=amd64 go build -v ./...
          GOOS=darwin GOARCH=arm64 go build -v ./...
          GOOS=windows GOARCH=amd64 go build -v ./...

      # go vet type-checks test files without running them, the build-tagged
      # ones (api, e2e, livegit) included, so no test file rots unseen.
      - name: Vet (default and build-tagged)
        run: |
          go vet ./...
          go vet -tags api ./...
          go vet -tags e2e ./...
          go vet -tags livegit ./...

  lint:
    name: lint
    needs: knowledge
    if: needs.knowledge.outputs.reused != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          # The witness check reads the event's commit range and its merge base.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - uses: ./.github/actions/restore-knowledge
        with:
          artifact: ${{ needs.knowledge.outputs.artifact }}
          digest: ${{ needs.knowledge.outputs.digest }}

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.8.0
          # Built from the Go module proxy: the action's default download from GitHub releases
          # answers 504 whenever GitHub's release downloads do, which fails the job for no code reason.
          install-mode: goinstall
          # Skip the action's online `config verify` step: it fetches the
          # golangci JSON schema from golangci-lint.run, which times out on
          # runner network blips and fails the whole job (nothing to do with
          # our code). Linting itself needs no network.
          verify: false

      # Static witness lines and drop trailers for the event's range (the
      # pre-push check, scripts/witness-check.sh); no test runs here.
      # A new ref, a dispatch or a tag has no usable before-SHA: its range starts at main.
      # A cancelled main push's commits are not checked here; the pre-push hook is the gate.
      - name: Witness lines
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base=origin/main
          if [ -n "$EVENT_BASE" ] && [ "$EVENT_BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$EVENT_BASE^{commit}" 2>/dev/null; then
            base=$EVENT_BASE
          fi
          go run scripts/check-witness.go --base "$base" --head "$GITHUB_SHA"
