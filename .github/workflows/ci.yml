name: CI

on:
  pull_request:
    branches: ['*']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Environment
        run: |
          git --version
          busybox | head -1 || true
          ls -l /bin/sh
          mkdir -p /tmp/stub
          for t in head mktemp date; do printf '#!/bin/sh\necho STUB-%s\n' "$t" > "/tmp/stub/$t"; chmod +x "/tmp/stub/$t"; done
          echo "busybox sh with stubs first on PATH:"; PATH=/tmp/stub:$PATH busybox sh -c 'head </dev/null; mktemp -u; date +%s' || true
          echo "dash with stubs first on PATH:"; PATH=/tmp/stub:$PATH dash -c 'head </dev/null; mktemp -u; date +%s' || true

      - name: Diagnose
        run: go test -count=1 -v -run 'TestZZProbe' ./internal/ops/ || true

      - name: Test
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 -v -run 'TestBrokeredGit|TestRunGitCmd|TestRelay|TestHandleSIGPIPE' ./internal/ops/ ./cmd/zcp/
