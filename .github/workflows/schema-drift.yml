name: Schema Drift

# Authenticated ACTIVE-catalog drift check. Strict mode treats missing/invalid
# auth and upstream failures as inconclusive failures, never a green SKIP.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: schema-drift
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment:
      name: schema-drift
      deployment: false
    env:
      ZCP_API_KEY: ${{ secrets.ZEROPS_SCHEMA_CHECK_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Require schema-check credential
        run: test -n "$ZCP_API_KEY"

      - name: Check schema drift
        run: |
          go run ./cmd/zcp schema check --strict
