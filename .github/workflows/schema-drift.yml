name: Schema Drift

# Public-schema drift check. Strict mode treats upstream fetch or validation
# failures as inconclusive failures, never a green SKIP.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: schema-drift
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Check schema drift
        run: |
          go run ./cmd/zcp schema check --strict
